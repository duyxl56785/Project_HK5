# Full local stack. Start it with: node scripts/demo/up.mjs (see docs/RUN_LOCAL.md).
# Only the UI (127.0.0.1:5173) and the Gateway (127.0.0.1:18080) are published. Secrets live in docker/secrets, written by gen-env.mjs. Inspect data with: docker compose ... exec postgres psql -U hk5 hk5_demo
name: hk5-demo

x-service: &service
  image: eclipse-temurin:21-jre
  restart: unless-stopped
  command: ["java", "-Xmx256m", "-Duser.timezone=UTC", "-jar", "/app/app.jar"]
  depends_on: &ready
    postgres:
      condition: service_healthy
    config-server:
      condition: service_healthy
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy

x-jwt: &jwt
  CONFIG_SERVER_URL: http://config-server:8888
  JWT_ISSUER_URI: ${JWT_ISSUER_URI:?run node scripts/demo/gen-env.mjs}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  JWT_HS256_CURRENT_KID: ${JWT_HS256_CURRENT_KID}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hk5
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: hk5_demo
    volumes:
      - pgdemo:/var/lib/postgresql/data
      - ./demo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hk5 -d hk5_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    secrets:
      - POSTGRES_PASSWORD
      - AUTH_DB_PASSWORD
      - AUTH_MIGRATION_PASSWORD
      - USER_DB_PASSWORD
      - USER_MIGRATION_PASSWORD

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache only: nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  discovery-server:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    command: ["java", "-Xmx256m", "-jar", "/app/app.jar"]
    volumes: ["../backend/discovery-server/build/libs/discovery-server-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761'"]
      interval: 3s
      timeout: 3s
      retries: 40

  config-server:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    command: ["java", "-Xmx256m", "-jar", "/app/app.jar"]
    depends_on:
      discovery-server:
        condition: service_healthy
    volumes: ["../backend/config-server/build/libs/config-server-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8888'"]
      interval: 3s
      timeout: 3s
      retries: 40

  auth-service:
    <<: *service
    volumes: ["../backend/auth-service/build/libs/auth-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      <<: *jwt
      SPRING_PROFILES_ACTIVE: migration
      AUTH_DB_HOST: postgres
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
    secrets:
      - AUTH_DB_PASSWORD
      - AUTH_MIGRATION_PASSWORD
      - SELLER_AUTH_TOKEN
      - WRITE_FENCE_TARGETS
      - ADMIN_BOOTSTRAP_PASSWORD
      - JWT_HS256_CURRENT_KEY_B64

  user-service:
    <<: *service
    volumes: ["../backend/user-service/build/libs/user-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      <<: *jwt
      SPRING_PROFILES_ACTIVE: migration
      USER_DB_HOST: postgres
      AUTH_INTERNAL_URL: http://auth-service:8101
    secrets:
      - { source: USER_AUTHORITY_TOKEN, target: AUTH_AUTHORITY_TOKEN }
      - USER_DB_PASSWORD
      - USER_MIGRATION_PASSWORD
      - JWT_HS256_CURRENT_KEY_B64

  seller-service:
    <<: *service
    volumes: ["../backend/seller-service/build/libs/seller-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      <<: *jwt
      SELLER_DB_URL: jdbc:postgresql://postgres:5432/seller_db
      SELLER_DB_USERNAME: hk5
      AUTH_INTERNAL_URL: http://auth-service:8101
      NOTIFICATION_INTERNAL_URL: http://notification-service:8108
    secrets:
      - { source: POSTGRES_PASSWORD, target: SELLER_DB_PASSWORD }
      - { source: SELLER_AUTHORITY_TOKEN, target: AUTH_AUTHORITY_TOKEN }
      - SELLER_AUTH_TOKEN
      - SELLER_NOTIFICATION_TOKEN
      - PRODUCT_SELLER_TOKEN
      - ORDER_SELLER_TOKEN
      - JWT_HS256_CURRENT_KEY_B64

  product-service:
    <<: *service
    volumes:
      - "../backend/product-service/build/libs/product-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"
      - productimages:/data/images
    environment:
      <<: *jwt
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/product_db
      PRODUCT_DB_USERNAME: hk5
      PRODUCT_IMAGE_DIR: /data/images
      AUTH_INTERNAL_URL: http://auth-service:8101
      SELLER_INTERNAL_URL: http://seller-service:8103
      INVENTORY_INTERNAL_URL: http://inventory-service:8105
    secrets:
      - { source: POSTGRES_PASSWORD, target: PRODUCT_DB_PASSWORD }
      - { source: PRODUCT_AUTHORITY_TOKEN, target: AUTH_AUTHORITY_TOKEN }
      - PRODUCT_SELLER_TOKEN
      - PRODUCT_INVENTORY_TOKEN
      - CART_PRODUCT_TOKEN
      - ORDER_PRODUCT_TOKEN
      - JWT_HS256_CURRENT_KEY_B64

  inventory-service:
    <<: *service
    volumes: ["../backend/inventory-service/build/libs/inventory-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      INVENTORY_DB_USERNAME: hk5
      INVENTORY_ORDER_PAIR_ENABLED: ${INVENTORY_ORDER_PAIR_ENABLED:?run node scripts/demo/gen-env.mjs}
    secrets:
      - { source: POSTGRES_PASSWORD, target: INVENTORY_DB_PASSWORD }
      - { source: PRODUCT_INVENTORY_TOKEN, target: INVENTORY_INTERNAL_TOKEN }
      - { source: ORDER_INVENTORY_TOKEN, target: INVENTORY_ORDER_PAIR_TOKEN }

  cart-service:
    <<: *service
    volumes: ["../backend/cart-service/build/libs/cart-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      <<: *jwt
      HK5_CART_JDBC_URL: jdbc:postgresql://postgres:5432/cart_db
      HK5_CART_DB_USER: hk5
      AUTH_INTERNAL_URL: http://auth-service:8101
      PRODUCT_INTERNAL_URL: http://product-service:8104
    secrets:
      - { source: POSTGRES_PASSWORD, target: HK5_CART_DB_PASSWORD }
      - { source: ORDER_CART_TOKEN, target: app.internal.checkout-token }
      - { source: CART_AUTHORITY_TOKEN, target: AUTH_AUTHORITY_TOKEN }
      - CART_PRODUCT_TOKEN
      - JWT_HS256_CURRENT_KEY_B64

  order-service:
    <<: *service
    volumes: ["../backend/order-service/build/libs/order-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      <<: *jwt
      HK5_ORDER_JDBC_URL: jdbc:postgresql://postgres:5432/order_db
      HK5_ORDER_DB_USER: hk5
      HK5_FINANCE_POLICY_APPROVED: ${HK5_FINANCE_POLICY_APPROVED:?run node scripts/demo/gen-env.mjs}
      HK5_FINANCE_PLATFORM_RATE: ${HK5_FINANCE_PLATFORM_RATE:?run node scripts/demo/gen-env.mjs}
      HK5_FINANCE_CURRENCY_SCALE: ${HK5_FINANCE_CURRENCY_SCALE:?run node scripts/demo/gen-env.mjs}
      HK5_FINANCE_HOUSE_EXEMPT: ${HK5_FINANCE_HOUSE_EXEMPT:?run node scripts/demo/gen-env.mjs}
      AUTH_INTERNAL_URL: http://auth-service:8101
      APP_CART_INTERNAL_URL: http://cart-service:8106
      PRODUCT_INTERNAL_URL: http://product-service:8104
      INVENTORY_INTERNAL_URL: http://inventory-service:8105
      SELLER_INTERNAL_URL: http://seller-service:8103
    secrets:
      - { source: POSTGRES_PASSWORD, target: HK5_ORDER_DB_PASSWORD }
      - { source: ORDER_AUTHORITY_TOKEN, target: AUTH_AUTHORITY_TOKEN }
      - { source: ORDER_CART_TOKEN, target: app.cart.internal-token }
      - ORDER_PRODUCT_TOKEN
      - ORDER_INVENTORY_TOKEN
      - ORDER_SELLER_TOKEN
      - JWT_HS256_CURRENT_KEY_B64

  notification-service:
    <<: *service
    volumes: ["../backend/notification-service/build/libs/notification-service-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      <<: *jwt
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      AUTH_INTERNAL_URL: http://auth-service:8101
      NOTIFICATION_DB_USERNAME: hk5
    secrets:
      - { source: NOTIFICATION_AUTHORITY_TOKEN, target: AUTH_AUTHORITY_TOKEN }
      - { source: POSTGRES_PASSWORD, target: NOTIFICATION_DB_PASSWORD }
      - SELLER_NOTIFICATION_TOKEN
      - JWT_HS256_CURRENT_KEY_B64

  api-gateway:
    <<: *service
    depends_on:
      <<: *ready
      auth-service:
        condition: service_started
    volumes: ["../backend/api-gateway/build/libs/api-gateway-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_URL: lb://auth-service
      USER_URL: lb://user-service
      SELLER_URL: lb://seller-service
      PRODUCT_URL: lb://product-service
      CART_URL: lb://cart-service
      ORDER_URL: lb://order-service
      NOTIFICATION_URL: lb://notification-service

  # Serves the built UI and proxies /api to the Gateway, so the browser stays same-origin.
  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on: [api-gateway]
    ports:
      - "127.0.0.1:5173:80"

secrets:
  ADMIN_BOOTSTRAP_PASSWORD:
    file: ./secrets/ADMIN_BOOTSTRAP_PASSWORD
  AUTH_DB_PASSWORD:
    file: ./secrets/AUTH_DB_PASSWORD
  AUTH_MIGRATION_PASSWORD:
    file: ./secrets/AUTH_MIGRATION_PASSWORD
  CART_AUTHORITY_TOKEN:
    file: ./secrets/CART_AUTHORITY_TOKEN
  CART_PRODUCT_TOKEN:
    file: ./secrets/CART_PRODUCT_TOKEN
  JWT_HS256_CURRENT_KEY_B64:
    file: ./secrets/JWT_HS256_CURRENT_KEY_B64
  NOTIFICATION_AUTHORITY_TOKEN:
    file: ./secrets/NOTIFICATION_AUTHORITY_TOKEN
  ORDER_AUTHORITY_TOKEN:
    file: ./secrets/ORDER_AUTHORITY_TOKEN
  ORDER_CART_TOKEN:
    file: ./secrets/ORDER_CART_TOKEN
  ORDER_INVENTORY_TOKEN:
    file: ./secrets/ORDER_INVENTORY_TOKEN
  ORDER_PRODUCT_TOKEN:
    file: ./secrets/ORDER_PRODUCT_TOKEN
  ORDER_SELLER_TOKEN:
    file: ./secrets/ORDER_SELLER_TOKEN
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  PRODUCT_AUTHORITY_TOKEN:
    file: ./secrets/PRODUCT_AUTHORITY_TOKEN
  PRODUCT_INVENTORY_TOKEN:
    file: ./secrets/PRODUCT_INVENTORY_TOKEN
  PRODUCT_SELLER_TOKEN:
    file: ./secrets/PRODUCT_SELLER_TOKEN
  SELLER_AUTHORITY_TOKEN:
    file: ./secrets/SELLER_AUTHORITY_TOKEN
  SELLER_AUTH_TOKEN:
    file: ./secrets/SELLER_AUTH_TOKEN
  SELLER_NOTIFICATION_TOKEN:
    file: ./secrets/SELLER_NOTIFICATION_TOKEN
  USER_AUTHORITY_TOKEN:
    file: ./secrets/USER_AUTHORITY_TOKEN
  USER_DB_PASSWORD:
    file: ./secrets/USER_DB_PASSWORD
  USER_MIGRATION_PASSWORD:
    file: ./secrets/USER_MIGRATION_PASSWORD
  WRITE_FENCE_TARGETS:
    file: ./secrets/WRITE_FENCE_TARGETS

volumes:
  pgdemo:
  productimages:
