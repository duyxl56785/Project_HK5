# Scope the four TV1 logins to their own DB without changing hk5_dev ACL/data.
local auth_db auth_app,auth_migrator scram-sha-256
local user_db user_app,user_migrator scram-sha-256
local all auth_app,auth_migrator,user_app,user_migrator reject
host auth_db auth_app,auth_migrator all scram-sha-256
host user_db user_app,user_migrator all scram-sha-256
host all auth_app,auth_migrator,user_app,user_migrator all reject
# Container-local administration is trusted; every TCP connection needs SCRAM.
local all all trust
host all all all scram-sha-256
