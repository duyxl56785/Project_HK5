server:
  port: 8105
spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${INVENTORY_DB_USERNAME:inventory}
    password: ${INVENTORY_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

inventory:
  internal-token: ${INVENTORY_INTERNAL_TOKEN:}
  order-pair-token: ${INVENTORY_ORDER_PAIR_TOKEN:}
