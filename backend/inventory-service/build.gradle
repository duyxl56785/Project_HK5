dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') { useJUnitPlatform { excludeTags 'postgres-integration' } }
tasks.register('postgresIntegrationTest', Test) {
    description = 'Runs Inventory PostgreSQL/Flyway/Hibernate regressions (Docker required).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres-integration' }
    // Keep Testcontainers compatible with Docker engines that require API 1.40 or newer.
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    shouldRunAfter tasks.named('test')
}
