dependencies {
    implementation project(':security-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'postgresql' }
}

tasks.register('integrationTest', Test) {
    description = 'Runs Seller persistence tests against PostgreSQL via Docker.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgresql' }
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    shouldRunAfter tasks.named('test')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/integrationTest')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/integrationTest')
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }
sourceSets {
    roleSyncIntegrationTest {
        java.srcDir 'src/roleSyncIntegrationTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    roleSyncIntegrationTestImplementation.extendsFrom testImplementation
    roleSyncIntegrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies { roleSyncIntegrationTestImplementation project(':auth-service') }
tasks.register('roleSyncIntegrationTest', Test) {
    description = 'Runs committed Seller outbox to actual Auth HTTP/PostgreSQL delivery.'
    group = 'verification'
    testClassesDirs = sourceSets.roleSyncIntegrationTest.output.classesDirs
    classpath = sourceSets.roleSyncIntegrationTest.runtimeClasspath
    workingDir projectDir
    useJUnitPlatform()
    shouldRunAfter tasks.named('integrationTest')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/roleSyncIntegrationTest')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/roleSyncIntegrationTest')
}
tasks.named('check') { dependsOn tasks.named('roleSyncIntegrationTest') }
