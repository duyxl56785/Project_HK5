dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JDK ImageIO has no WebP decoder; keep the plugin local to this module.
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    // Production persistence tests exercise PostgreSQL's COPY input path as well as JDBC/JPA.
    testImplementation 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'postgresql' }
}

tasks.register('integrationTest', Test) {
    description = 'Runs product-service integration tests against PostgreSQL via Docker.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgresql' }
    // Boot's managed Docker client defaults to an API rejected by newer Docker engines.
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    shouldRunAfter tasks.named('test')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/integrationTest')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/integrationTest')
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }
