dependencies {
    implementation project(':security-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JDK ImageIO has no WebP decoder; keep the plugin local to this module.
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'postgresql' }
}

tasks.register('integrationTest', Test) {
    description = 'Runs Category integration tests against PostgreSQL via Docker.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgresql' }
    // Boot's managed Docker client defaults to an API rejected by newer Docker engines.
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    shouldRunAfter tasks.named('test')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/integrationTest')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/integrationTest')
}

tasks.named('check') { dependsOn tasks.named('integrationTest') }
sourceSets {
    authorityIntegrationTest {
        java.srcDir 'src/authorityIntegrationTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    authorityIntegrationTestImplementation.extendsFrom testImplementation
    authorityIntegrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    authorityIntegrationTestImplementation project(':auth-service')
    authorityIntegrationTestImplementation project(':seller-service')
}
tasks.register('authorityIntegrationTest', Test) {
    description = 'Runs Product authority against actual Auth/Seller HTTP and isolated PostgreSQL databases.'
    group = 'verification'
    testClassesDirs = sourceSets.authorityIntegrationTest.output.classesDirs
    classpath = sourceSets.authorityIntegrationTest.runtimeClasspath
    workingDir projectDir
    useJUnitPlatform()
    shouldRunAfter tasks.named('integrationTest')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/authorityIntegrationTest')
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/authorityIntegrationTest')
}
tasks.named('check') { dependsOn tasks.named('authorityIntegrationTest') }
