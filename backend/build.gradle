plugins {
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

allprojects {
    group = 'com.projecthk5'
    version = '0.1.0-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.5'
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        if (!['security-common', 'discovery-server', 'config-server'].contains(project.name)) {
            implementation 'org.springframework.cloud:spring-cloud-starter-config'
            implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        }
    }

    tasks.named('test') { useJUnitPlatform() }

    tasks.withType(Test).configureEach {
        // Apply to every forked test JVM, including Auth and custom PostgreSQL tasks.
        systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
        // Tests have no Auth to ask; CurrentAuthorityFilterTest covers the filter directly.
        systemProperty 'security.current-authority.enabled', 'false'
        // Tests run without the platform services; each integration test starts what it needs.
        systemProperty 'spring.cloud.config.enabled', 'false'
        systemProperty 'eureka.client.enabled', 'false'
        systemProperty 'spring.kafka.listener.auto-startup', 'false'
    }
}
