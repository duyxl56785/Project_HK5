dependencies {
    implementation project(':security-common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql:1.20.2'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.2'
}

// PostgreSQL 16 integration tests require Docker; never report PASS from unit tests.
tasks.named('test') { useJUnitPlatform { excludeTags 'postgres-integration' } }
tasks.register('postgresIntegrationTest', Test) {
    description = 'Runs real PostgreSQL16/Flyway/Hibernate integration tests (Docker required).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres-integration' }
    shouldRunAfter tasks.named('test')
}


// W2 journal acceptance: GitHub Backend readiness has Docker/PG16 available.
// Include tagged real-PostgreSQL tests on GitHub Actions instead of calling
// unit-only build SUCCESS "database verified". Local build remains Docker-free;
// developers may run postgresIntegrationTest explicitly with Docker installed.
if (System.getenv('GITHUB_ACTIONS') == 'true') {
    tasks.named('check') { dependsOn tasks.named('postgresIntegrationTest') }
}

tasks.named('postgresIntegrationTest', Test) {
    testLogging { events 'failed', 'skipped' }
    afterSuite { desc, result ->
        if (desc.parent == null) {
            logger.lifecycle("ORDER_PG16_TEST_SUMMARY tests=${result.testCount} passed=${result.successfulTestCount} failed=${result.failedTestCount} skipped=${result.skippedTestCount}")
        }
    }
}
