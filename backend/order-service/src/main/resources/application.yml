server:
  port: 8107
spring:
  application:
    name: order-service
  datasource:
    url: ${HK5_ORDER_JDBC_URL:jdbc:postgresql://localhost:5432/hk5_order}
    username: ${HK5_ORDER_DB_USER:hk5}
    password: ${HK5_ORDER_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
          jwk-set-uri: ${JWT_JWK_SET_URI:}
app:
  security:
    audience: ${JWT_AUDIENCE:smart-ecommerce-api}
