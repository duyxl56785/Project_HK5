// Gateway 4.1.6 calls HttpHeaders.headerSet(), introduced in Framework 6.1.15.
ext['spring-framework.version'] = '6.1.15'

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}

// Separate JVM keeps Auth's servlet stack/dependency versions out of Gateway.
tasks.named('test') {
    dependsOn ':auth-service:bootJar'
    inputs.file(project(':auth-service').tasks.named('bootJar').flatMap { it.archiveFile }).withPropertyName('authBootJar')
    systemProperty 'hk5.test.authJar', project(':auth-service').tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'user.timezone', 'UTC'
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('HTTP/PostgreSQL integration must execute') { true }
}
