dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
}

// Gateway 4.1.6 (Spring Cloud 2023.0.5) calls HttpHeaders.headerSet(), which only exists from
// Spring Framework 6.1.15; Boot 3.3.5 ships 6.1.14, so every proxied request failed with
// NoSuchMethodError. 4.1.5 is the newest gateway compatible with this Boot line.
dependencyManagement {
    dependencies {
        dependencySet(group: 'org.springframework.cloud', version: '4.1.5') {
            entry 'spring-cloud-gateway-server'
            entry 'spring-cloud-starter-gateway'
        }
    }
}
