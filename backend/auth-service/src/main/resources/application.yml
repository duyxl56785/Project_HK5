server:
  port: 8101
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/auth_db
    username: auth_app
    password: ${AUTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # DDL runs only with the separate migration profile and credentials.
    enabled: false
    clean-disabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
# Auth is the authority itself; its own routes read the account directly.
security:
  current-authority:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
