dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
}

tasks.named('test') {
    inputs.property 'databaseReadiness', System.getenv('TV1_DATABASE_TESTS') ?: 'false'
    outputs.upToDateWhen { System.getenv('TV1_DATABASE_TESTS') != 'true' }
    outputs.doNotCacheIf('Live database state must be checked') { System.getenv('TV1_DATABASE_TESTS') == 'true' }
}
