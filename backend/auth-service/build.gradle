dependencies {
    implementation project(':security-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Production JWT codec (no servlet security chain/API enabled in this isolated slice).
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    systemProperty 'user.timezone', 'UTC'
    inputs.property 'databaseReadiness', System.getenv('TV1_DATABASE_TESTS') ?: 'false'
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('PostgreSQL state must be checked') { true }
}
