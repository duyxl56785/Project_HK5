server:
  port: 8106
spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888},optional:configtree:/run/secrets/
  application:
    name: cart-service
  datasource:
    url: ${HK5_CART_JDBC_URL:jdbc:postgresql://localhost:5432/hk5_cart}
    username: ${HK5_CART_DB_USER:hk5}
    password: ${HK5_CART_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    issuer: ${JWT_ISSUER_URI:}
    audience: ${JWT_AUDIENCE:}
    current-kid: ${JWT_HS256_CURRENT_KID:}
    current-key-b64: ${JWT_HS256_CURRENT_KEY_B64:}
    previous-kid: ${JWT_HS256_PREVIOUS_KID:}
    previous-key-b64: ${JWT_HS256_PREVIOUS_KEY_B64:}
