# Overlay only for TV5's disposable, local UAT rehearsal.
# Run with docker/compose.demo.yml and a project name beginning hk5-uat-.
# The base stack keeps services on its private Docker network; only UI/Gateway bind to loopback here.
name: ${HK5_UAT_PROJECT:?Set HK5_UAT_PROJECT to an hk5-uat-* name}

services:
  api-gateway:
    ports: !override
      - "127.0.0.1:${HK5_UAT_GATEWAY_PORT:?Set HK5_UAT_GATEWAY_PORT}:8080"

  frontend:
    ports: !override
      - "127.0.0.1:${HK5_UAT_FRONTEND_PORT:?Set HK5_UAT_FRONTEND_PORT}:80"

volumes:
  # Explicit names make it possible to inspect and remove only the disposable UAT resources.
  pgdemo:
    name: ${HK5_UAT_PROJECT}-pgdemo
  productimages:
    name: ${HK5_UAT_PROJECT}-productimages

# The base demo Compose file points these at docker/secrets.  Rebind every source
# to the per-project runtime directory so an isolated rehearsal never reads or
# rewrites a developer's shared demo credentials.
secrets:
  ADMIN_BOOTSTRAP_PASSWORD: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/ADMIN_BOOTSTRAP_PASSWORD" }
  AUTH_DB_PASSWORD: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/AUTH_DB_PASSWORD" }
  AUTH_MIGRATION_PASSWORD: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/AUTH_MIGRATION_PASSWORD" }
  CART_AUTHORITY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/CART_AUTHORITY_TOKEN" }
  CART_PRODUCT_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/CART_PRODUCT_TOKEN" }
  JWT_HS256_CURRENT_KEY_B64: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/JWT_HS256_CURRENT_KEY_B64" }
  NOTIFICATION_AUTHORITY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/NOTIFICATION_AUTHORITY_TOKEN" }
  ORDER_AUTHORITY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/ORDER_AUTHORITY_TOKEN" }
  ORDER_CART_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/ORDER_CART_TOKEN" }
  ORDER_INVENTORY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/ORDER_INVENTORY_TOKEN" }
  ORDER_PRODUCT_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/ORDER_PRODUCT_TOKEN" }
  ORDER_SELLER_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/ORDER_SELLER_TOKEN" }
  POSTGRES_PASSWORD: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/POSTGRES_PASSWORD" }
  PRODUCT_AUTHORITY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/PRODUCT_AUTHORITY_TOKEN" }
  PRODUCT_INVENTORY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/PRODUCT_INVENTORY_TOKEN" }
  PRODUCT_SELLER_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/PRODUCT_SELLER_TOKEN" }
  SELLER_AUTHORITY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/SELLER_AUTHORITY_TOKEN" }
  SELLER_AUTH_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/SELLER_AUTH_TOKEN" }
  SELLER_NOTIFICATION_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/SELLER_NOTIFICATION_TOKEN" }
  USER_AUTHORITY_TOKEN: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/USER_AUTHORITY_TOKEN" }
  USER_DB_PASSWORD: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/USER_DB_PASSWORD" }
  USER_MIGRATION_PASSWORD: { file: "${HK5_UAT_SECRETS_DIR:?Set HK5_UAT_SECRETS_DIR}/USER_MIGRATION_PASSWORD" }
