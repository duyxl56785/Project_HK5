name: Frontend and E2E
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'docker/**', 'scripts/demo/**', '.github/workflows/frontend-e2e.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'docker/**', 'scripts/demo/**', '.github/workflows/frontend-e2e.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generated env keeps both gates off unless opted in
        run: node --test scripts/demo/gen-env.test.mjs
      - name: Start the stack from fresh volumes and seed it, local demo opt-in only
        run: node scripts/demo/up.mjs --approved-inventory-pair --approved-finance-policy
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright on the live stack
        working-directory: frontend
        run: npm run e2e
      - name: Token, access, proxy and restart checks
        run: node scripts/demo/smoke-review.mjs
      - name: Service logs
        if: failure()
        run: docker compose --env-file .env.demo -f docker/compose.demo.yml logs --no-color --tail=80
